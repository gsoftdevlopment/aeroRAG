[project]
name = "aerorag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "llama-cloud>=2.19.0",
    "pymupdf>=1.28",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
